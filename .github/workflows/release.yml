name: Full Tilt Native release

# Push a tag like v0.1.0 to build the Windows release on GitHub (MSVC, x64) and publish it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v0.1.0 (leave empty for a test build without a release)'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Get SDL2 and SDL2_mixer (Visual C++ development packages)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Libs | Out-Null
          Invoke-WebRequest https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-devel-2.30.9-VC.zip -OutFile sdl2.zip
          Invoke-WebRequest https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-devel-2.8.0-VC.zip -OutFile mixer.zip
          Expand-Archive sdl2.zip -DestinationPath Libs
          Expand-Archive mixer.zip -DestinationPath Libs
          Rename-Item Libs/SDL2-2.30.9 SDL2
          Rename-Item Libs/SDL2_mixer-2.8.0 SDL2_mixer

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "dev" }
          cmake -S . -B build -A x64 -DCMAKE_WIN32_EXECUTABLE:BOOL=1 "-DFTN_VERSION=$version"
          cmake --build build --config Release

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } elseif ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $out = "FullTiltNative"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item bin/Release/FullTiltPinball.exe, bin/Release/FullTiltEngine.exe, bin/Release/FullTiltUpdate.exe, bin/Release/SDL2.dll, bin/Release/SDL2_mixer.dll $out
          Copy-Item dist/README.txt $out
          # Epic Pinball build tools (no game code): the launcher's "Compile Epic Pinball tables" button runs them
          New-Item -ItemType Directory -Force -Path "$out/epic/tools/seeds", "$out/epic/runtime", "$out/epic/sdk/lib/x64" | Out-Null
          Copy-Item epic/README.md "$out/epic"
          Copy-Item epic/tools/*.py "$out/epic/tools"
          Copy-Item epic/tools/seeds/* "$out/epic/tools/seeds"
          Copy-Item epic/runtime/* "$out/epic/runtime"
          Copy-Item -Recurse Libs/SDL2/include "$out/epic/sdk/include"
          Copy-Item Libs/SDL2/lib/x64/SDL2.lib, Libs/SDL2/lib/x64/SDL2.dll "$out/epic/sdk/lib/x64"
          New-Item -ItemType Directory -Force -Path "$out/Put game files here", "$out/tables" | Out-Null
          Copy-Item dist/DROP_README.txt "$out/Put game files here/README.txt"
          Set-Content "$out/tables/README.txt" "Tables are added here automatically from the 'Put game files here' folder. One folder per table."
          $zip = "FullTiltNative-$version-windows-x64.zip"
          Compress-Archive -Path $out -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: FullTiltNative-windows-x64
          path: ${{ steps.pkg.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.version }}" "${{ steps.pkg.outputs.zip }}" --title "Full Tilt Native ${{ steps.pkg.outputs.version }}" --notes-file dist/RELEASE_NOTES.md --target "$env:GITHUB_SHA"
